<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      What crawlers and link previews read before JavaScript runs. %PUBLIC_URL%
      is replaced with the site's address when the BFF serves this file, and
      %GA_MEASUREMENT_ID% with the Google Analytics id (empty: no analytics).
      Pages set their own title and description once the app has loaded
      (src/page-meta.ts).
    -->
    <title>Relaxa'Son - Découvrez le pouvoir thérapeutique des sons</title>
    <meta
      name="description"
      content="Une approche holistique qui utilise les vibrations et les fréquences sonores pour apaiser le mental, favoriser l'équilibre intérieur, la relaxation et le bien-être."
    />
    <link rel="canonical" href="%PUBLIC_URL%/" />
    <!--
      Icons: favicon.ico (48, 32 and 16 px) for browsers that ask for it and
      for search results, the logo as PNG, and a 180 px square for phones'
      home screens.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Link previews (Open Graph, read by most platforms, and X's card). Pages
      update these once the app has loaded (src/page-meta.ts); crawlers that
      don't run JavaScript see the home page's. Replace public/og-image.jpg
      (1200 × 630) with a new one when needed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relaxa'Son" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="Relaxa'Son - Découvrez le pouvoir thérapeutique des sons"
    />
    <meta
      property="og:description"
      content="Une approche holistique qui utilise les vibrations et les fréquences sonores pour apaiser le mental, favoriser l'équilibre intérieur, la relaxation et le bien-être."
    />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta name="ga-measurement-id" content="%GA_MEASUREMENT_ID%" />
    <!--
      Structured data: the site, and the organisation behind it, whose logo
      search results may show (a square image of at least 112 px).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%PUBLIC_URL%/#website",
            "name": "Relaxa'Son",
            "url": "%PUBLIC_URL%/",
            "inLanguage": "fr",
            "description": "Une approche holistique qui utilise les vibrations et les fréquences sonores pour apaiser le mental, favoriser l'équilibre intérieur, la relaxation et le bien-être.",
            "publisher": { "@id": "%PUBLIC_URL%/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "%PUBLIC_URL%/#organization",
            "name": "Relaxa'Son",
            "url": "%PUBLIC_URL%/",
            "logo": "%PUBLIC_URL%/logo.png"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
